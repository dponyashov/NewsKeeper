server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Включаем Gzip-сжатие для быстрой загрузки JS и CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Поддержка SPA (перенаправление всех маршрутов на index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статических ресурсов Vite (с хешами в именах файлов)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
