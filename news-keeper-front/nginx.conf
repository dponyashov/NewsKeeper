server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Максимальный размер загружаемых файлов (должен совпадать с Spring Boot)
    client_max_body_size 15M;

    # Gzip-сжатие статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 1. Проксирование REST API на бэкенд
    location /api/ {
        proxy_pass http://news-backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Проксирование картинок из бакета S3 (SeaweedFS)
    # Имя location должно совпадать с именем бакета S3_BUCKET (по умолчанию news-media)
    location /news-media/ {
        proxy_pass http://s3-news:8333/news-media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Кеширование картинок в браузере на 30 дней
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Поддержка SPA (маршруты React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование JS/CSS бандлов Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
