server:
  port: ${NEWS_SERVER_PORT:8081}

spring:
  application:
    name: news-keeper-back
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_NEWS_URL}
    username: ${DB_NEWS_USER}
    password: ${DB_NEWS_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  variables:
    node-env: ${NODE_ENV:dev}
    front-url: ${FRONT_URL:http://localhost:5174}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:news-media}
      region: ${S3_REGION:us-east-1}
    jwt:
      at-secret-key: ${JWT_ACCESS_SECRET}
      rt-secret-key: ${JWT_REFRESH_SECRET}
      at-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      rt-expiration: ${JWT_REFRESH_EXPIRATION:604800000}